name: "CI Gate Auto-Approve"

on:
  workflow_run:
    workflows: ["Master CI/CD Pipeline"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  approve:
    name: Approve PR if CI passed
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find open PR for this branch
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open PR found for branch $BRANCH; nothing to approve."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only approve the exact commit that finished CI — if the PR has moved
          # on since this run started, a newer workflow_run will handle it.
          head_sha=$(gh pr view "$pr_number" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$head_sha" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "PR #$pr_number has moved on (now $head_sha); skipping stale approval."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          already_approved=$(gh pr view "$pr_number" --repo "$REPO" --json reviews \
            --jq '[.reviews[] | select(.author.login == "admin-nelsongrey" and .state == "APPROVED")] | length')
          if [ "$already_approved" -gt 0 ]; then
            echo "PR #$pr_number already has an approval from admin-nelsongrey; skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Approve as bot account
        if: steps.find_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.AI_REVIEWER_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE \
            -f commit_id="$HEAD_SHA" \
            -f body="All required checks passed on \`$HEAD_SHA\`. Approved automatically by admin-nelsongrey — this confirms CI is green, it is not a code-level review."
