name: Secret Scan

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan repository
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
