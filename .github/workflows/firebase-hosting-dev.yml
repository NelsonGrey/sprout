name: "Deploy Web App to Dev (Hosting)"

# Triggered on every push to develop — deploys the web app to the
# nelsongrey-sprout-dev Firebase Hosting project for review and testing. Business
# logic lives in Firebase Functions (private, server-side). This workflow
# publishes only the compiled dist/ bundle; no source is exposed.
#
# Auth: Workload Identity Federation (see google-github-actions/auth below) —
# GitHub's OIDC token is exchanged for short-lived Google credentials scoped
# to this exact branch via the github-actions-hosting service account's IAM
# binding. No static key or firebase-tools token is stored anywhere; nothing
# here can expire the way the old FIREBASE_TOKEN secret did.

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - develop

concurrency:
  group: firebase-hosting-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-hosting-dev:
    name: Build and Deploy to Firebase Hosting (Dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps 2>/dev/null || npm ci --force
          npm run build --workspace=@sprout/shared
          npm run build --workspace=@shared/firebase-utils

      - name: Build Web App
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build --workspace=@sprout/web

      - name: Use Dev Firebase Config
        run: cp firebase.dev.json firebase.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/968230602171/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "github-actions-hosting@nelsongrey-sprout-dev.iam.gserviceaccount.com"

      - name: Deploy Firebase Hosting
        run: |
          firebase deploy \
            --project="nelsongrey-sprout-dev" \
            --only=hosting \
            --message="Dev hosting deploy from develop — ${{ github.sha }}" \
            --non-interactive
